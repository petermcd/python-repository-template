[project]
name = "my-super-project"
version = "0.1.0"
description = "This is my super project that does amazing things."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">={ PYTHON VERSION }"
dependencies = []

[dependency-groups]
dev = [
    "pygments>=2.20.0", # To resolve security vulnerabilities in dependencies pytest sphinx
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mypy-plugins>=4.0.0",
    "ruff>=0.15.10",
    "troml>=0.4.1",
    "ty>=0.0.29",
]

[tool.pytest.ini_options]
addopts = "--cov=tpc_plugin_validator --cov-report term-missing --cov-report xml:coverage.xml"

[tool.ruff]
line-length = 120
