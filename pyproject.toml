[project]
name = "my-super-project"
version = "0.1.0"
authors = [{ name = "Bob Smith", email = "git@bob-smith.co.uk"}]
description = "This is my super project that does amazing things."
keywords = ["super", "project", "amazing"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">={ PYTHON_MIN_VERSION }"
dependencies = []

[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
addopts = "--cov={ PROJECT_SOURCE } --cov-report term-missing --cov-report xml:coverage.xml"

[tool.ruff]
line-length = 120

[cosmic-ray]
module-path = "{ PROJECT_SOURCE }"
timeout = 10.0
excluded-modules = []
test-command = "uv run pytest"

[cosmic-ray.distributor]
name = "local"
